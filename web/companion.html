<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Realm Web Companion</title>
  <style>
    :root { color-scheme: dark; font: 14px/1.4 system-ui, sans-serif; background: #11171b; color: #e3e9e6; }
    body { max-width: 1200px; margin: 0 auto; padding: 1rem; }
    h1, h2, h3 { line-height: 1.2; }
    h1 { margin: 0 0 .1rem; font-size: 1.45rem; } h2 { margin: 0 0 .5rem; font-size: 1.1rem; }
    .muted { color: #a5b5ae; } .error { color: #ff9292; }
    .controls { display: flex; flex-wrap: wrap; align-items: end; gap: .6rem; margin: .9rem 0 .4rem; }
    label { display: grid; gap: .25rem; font-weight: 600; }
    select, button { font: inherit; padding: .35rem .55rem; color: inherit; background: #202b30; border: 1px solid #3b4d50; border-radius: 5px; }
    select { min-width: 12rem; max-width: 100%; }
    button { cursor: pointer; }
    button:hover, select:hover { border-color: #78aaa0; }
    :focus-visible { outline: 2px solid #8bd3bb; outline-offset: 2px; }
    #status { min-height: 1.4em; margin: .25rem 0; }
    .tabs { display: flex; gap: .25rem; overflow-x: auto; border-bottom: 1px solid #3b4d50; margin: .5rem 0 .75rem; padding: 0 0 .25rem; }
    .tabs button { flex: none; border-color: transparent; background: transparent; white-space: nowrap; color: #a5b5ae; }
    .tabs button[aria-selected="true"] { background: #253d3c; border-color: #467a70; color: #d6fff0; }
    [hidden] { display: none !important; }
    .panel > section, details, #history section { background: #1b252a; border: 1px solid #334448; border-radius: 6px; padding: .65rem .8rem; margin: .5rem 0; }
    .panel > section section { background: #202e32; border: 1px solid #334448; border-radius: 5px; padding: .6rem .7rem; }
    section h3 { margin: 0 0 .4rem; font-size: 1rem; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: .5rem; }
    .grid section { margin: 0; }
    dl { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: .1rem .6rem; margin: .25rem 0; }
    dt { font-weight: 600; color: #a7c9b9; } dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
    table { border-collapse: collapse; width: 100%; display: block; overflow-x: auto; }
    th, td { border-bottom: 1px solid #334448; padding: .3rem .6rem .3rem 0; text-align: left; vertical-align: top; }
    code, pre { font: 13px/1.45 ui-monospace, Consolas, monospace; }
    pre { overflow: auto; background: #111b20; padding: .55rem; margin: .3rem 0; border-radius: 4px; }
    .json-key { color: #d7a9ff; } .json-string { color: #a9dfaa; }
    .json-number { color: #ffc28c; } .json-literal { color: #8dcfff; }
    summary { cursor: pointer; font-weight: 600; }
    #map-diagram { overflow-x: auto; }
    @media (max-width: 600px) { body { padding: .7rem; } .controls label { flex: 1 1 100%; } select { width: 100%; } dl { grid-template-columns: minmax(0, 1fr); } dt { margin-top: .25rem; } }
  </style>
</head>
<body>
  <h1>Realm Web Companion</h1>
  <div class="muted">Read-only state inspector for trusted developers and GMs.</div>
  <div class="controls">
    <label>Game <select id="game"></select></label>
    <label>State view <select id="view"><option value="">All</option></select></label>
    <button id="refresh" type="button">Refresh</button>
  </div>
  <p id="status" role="status"></p>
  <main>
    <div id="tabs" class="tabs" role="tablist" aria-label="Companion sections"></div>
    <div id="state"></div>
    <div id="history-panel" class="panel" role="tabpanel" aria-labelledby="tab-history" hidden>
      <h2>Revision and event history</h2>
      <p class="muted">Trusted GM/developer audit history. Events are shown for every revision, including in actor mode.</p>
      <div id="history"></div>
    </div>
  </main>
  <script src="/companion-map.js"></script>
  <script>
    const gameSelect = document.querySelector('#game');
    const viewSelect = document.querySelector('#view');
    const stateRoot = document.querySelector('#state');
    const tabsRoot = document.querySelector('#tabs');
    const historyRoot = document.querySelector('#history');
    const historyPanel = document.querySelector('#history-panel');
    const status = document.querySelector('#status');
    let selection = 0;
    let stateRequest = 0;
    let authoritative = null;
    let activeTab = 'game';
    let mapRequest = 0;
    let mermaidPromise;

    function mermaidLibrary() {
      if (!mermaidPromise) mermaidPromise = import('https://cdn.jsdelivr.net/npm/mermaid@11.12.2/dist/mermaid.esm.min.mjs')
        .then(({ default: mermaid }) => {
          mermaid.initialize({ startOnLoad: false, securityLevel: 'strict', flowchart: { htmlLabels: false } });
          return mermaid;
        });
      return mermaidPromise;
    }
    async function renderMap(state, root) {
      const request = ++mapRequest;
      if (!state.entities.some(entity => entity.kind === 'place')) {
        root.append(element('p', 'No places in this state.', 'muted'));
        return;
      }
      root.append(element('p', 'Rendering map…', 'muted'));
      try {
        const mermaid = await mermaidLibrary();
        if (request !== mapRequest) return;
        const { svg } = await mermaid.render(`realm-map-${request}`, realmMapSource(state));
        if (request === mapRequest) root.innerHTML = svg;
      } catch (error) {
        if (request === mapRequest) root.replaceChildren(element('p', `Could not render map: ${error.message}`, 'error'));
      }
    }

    function element(tag, value, className) {
      const node = document.createElement(tag);
      if (value !== undefined) node.textContent = String(value);
      if (className) node.className = className;
      return node;
    }
    function message(value, isError = false) {
      status.textContent = value;
      status.className = isError ? 'error' : 'muted';
    }
    async function get(path) {
      const response = await fetch(path);
      if (!response.ok) {
        let detail = response.statusText;
        try { detail = (await response.json()).message || detail; } catch (_) { /* Use status text. */ }
        throw new Error(`${response.status}: ${detail}`);
      }
      return response.json();
    }
    function option(value, label) {
      const node = element('option', label);
      node.value = value;
      return node;
    }
    function display(value) {
      if (value === null) return 'null';
      if (typeof value === 'object') return JSON.stringify(value, null, 2);
      return String(value);
    }
    function fields(record) {
      const list = element('dl');
      for (const [key, value] of Object.entries(record)) {
        list.append(element('dt', key.replaceAll('_', ' ')));
        const cell = element('dd');
        if (value !== null && typeof value === 'object') {
          cell.append(element('pre', display(value)));
        } else {
          cell.textContent = display(value);
        }
        list.append(cell);
      }
      return list;
    }
    function showTab(key) {
      activeTab = key;
      for (const tab of tabsRoot.children) {
        const selected = tab.dataset.key === key;
        tab.setAttribute('aria-selected', String(selected));
        tab.tabIndex = selected ? 0 : -1;
      }
      for (const panel of stateRoot.children) panel.hidden = panel.dataset.key !== key;
      historyPanel.hidden = key !== 'history';
    }
    function addTab(key, label, panel) {
      const tab = element('button', label);
      tab.type = 'button';
      tab.id = `tab-${key}`;
      tab.dataset.key = key;
      tab.setAttribute('role', 'tab');
      tab.setAttribute('aria-controls', panel.id);
      tab.addEventListener('click', () => showTab(key));
      tabsRoot.append(tab);
    }
    tabsRoot.addEventListener('keydown', event => {
      const tabs = [...tabsRoot.children];
      const index = tabs.indexOf(document.activeElement);
      if (index < 0) return;
      const next = event.key === 'ArrowRight' ? (index + 1) % tabs.length
        : event.key === 'ArrowLeft' ? (index - 1 + tabs.length) % tabs.length
        : event.key === 'Home' ? 0 : event.key === 'End' ? tabs.length - 1 : -1;
      if (next < 0) return;
      event.preventDefault();
      tabs[next].focus();
      showTab(tabs[next].dataset.key);
    });
    function statePanel(key, label) {
      const panel = element('div', undefined, 'panel');
      panel.id = `panel-${key}`;
      panel.dataset.key = key;
      panel.setAttribute('role', 'tabpanel');
      panel.setAttribute('aria-labelledby', `tab-${key}`);
      panel.tabIndex = 0;
      stateRoot.append(panel);
      addTab(key, label, panel);
      return panel;
    }
    function renderState(state) {
      stateRoot.replaceChildren();
      tabsRoot.replaceChildren();
      const gamePanel = statePanel('game', 'Game');
      const game = element('section');
      game.append(element('h3', 'Game'), fields(state.game));
      if (state.actor_id) game.append(fields({ actor_id: state.actor_id }));
      gamePanel.append(game);
      const mapPanel = statePanel('map', 'Map');
      const mapSection = element('section');
      mapSection.append(element('h3', 'World map'));
      const mapDiagram = element('div');
      mapDiagram.id = 'map-diagram';
      mapSection.append(mapDiagram);
      mapPanel.append(mapSection);
      renderMap(state, mapDiagram);
      for (const [key, value] of Object.entries(state)) {
        if (key === 'game' || key === 'actor_id') continue;
        const label = key.replaceAll('_', ' ');
        const count = Array.isArray(value) ? value.length : 1;
        const panel = statePanel(key, `${label} (${count})`);
        const section = element('section');
        section.append(element('h3', `${label} (${count})`));
        if (Array.isArray(value) && value.length === 0) {
          section.append(element('p', 'None', 'muted'));
        } else if (Array.isArray(value)) {
          const grid = element('div', undefined, 'grid');
          for (const item of value) {
            const card = element('section');
            if (key === 'entities' && item.illustration?.url) {
              const image = document.createElement('img');
              image.src = item.illustration.url;
              image.alt = `Illustration of ${item.name || 'entity'}`;
              image.loading = 'lazy';
              image.style.cssText = 'display:block;max-width:100%;max-height:320px;object-fit:contain';
              card.append(image);
            }
            card.append(fields(item));
            grid.append(card);
          }
          section.append(grid);
        } else {
          section.append(fields(value));
        }
        panel.append(section);
      }
      addTab('history', 'History', historyPanel);
      showTab([...tabsRoot.children].some(tab => tab.dataset.key === activeTab) ? activeTab : 'game');
    }
    function highlightedJson(value) {
      const code = element('code');
      const source = JSON.stringify(value, null, 2);
      const tokens = /"(?:\\.|[^"\\])*"(?=\s*:)|"(?:\\.|[^"\\])*"|-?\d+(?:\.\d+)?(?:[eE][+-]?\d+)?|\b(?:true|false|null)\b/g;
      let offset = 0;
      for (const match of source.matchAll(tokens)) {
        code.append(document.createTextNode(source.slice(offset, match.index)));
        const token = match[0];
        const kind = token[0] === '"' ? (/^\s*:/.test(source.slice(match.index + token.length)) ? 'key' : 'string')
          : /^(true|false|null)$/.test(token) ? 'literal' : 'number';
        code.append(element('span', token, `json-${kind}`));
        offset = match.index + token.length;
      }
      code.append(document.createTextNode(source.slice(offset)));
      return code;
    }
    function renderEvents(container, revisionNumber, events) {
      container.replaceChildren();
      if (!events.length) { container.append(element('p', 'No events.', 'muted')); return; }
      for (const event of events) {
        const block = element('section');
        block.append(element('strong', `${revisionNumber}.${event.ordinal}  ${event.type}`));
        block.append(fields({ created_at: event.created_at }));
        const payload = element('pre');
        payload.append(highlightedJson(event.payload));
        block.append(payload);
        container.append(block);
      }
    }
    function renderHistory(gameId, revisions, ticket) {
      historyRoot.replaceChildren();
      if (!revisions.length) { historyRoot.append(element('p', 'No revisions yet.', 'muted')); return; }
      for (const revision of [...revisions].reverse()) {
        const details = element('details');
        details.append(element('summary', `Revision ${revision.revision_number} · ${revision.mutation_kind} · ${revision.created_at}`));
        details.append(fields({ id: revision.id, idempotency_key: revision.idempotency_key, metadata: revision.metadata }));
        const eventsRoot = element('div');
        details.append(eventsRoot);
        details.addEventListener('toggle', async () => {
          if (!details.open || details.dataset.loaded) return;
          details.dataset.loaded = 'true';
          eventsRoot.append(element('p', 'Loading events…', 'muted'));
          try {
            const events = await get(`/games/${encodeURIComponent(gameId)}/revisions/${revision.revision_number}/events`);
            if (ticket === selection) renderEvents(eventsRoot, revision.revision_number, events);
          } catch (error) {
            if (ticket === selection) {
              eventsRoot.replaceChildren(element('p', `Could not load events: ${error.message}`, 'error'));
              delete details.dataset.loaded;
            }
          }
        });
        historyRoot.append(details);
      }
    }
    async function loadState(ticket) {
      const request = ++stateRequest;
      const gameId = gameSelect.value;
      if (!gameId || !authoritative) return;
      message('Loading state...');
      try {
        const state = viewSelect.value
          ? await get(`/games/${encodeURIComponent(gameId)}/state?actor_id=${encodeURIComponent(viewSelect.value)}`)
          : authoritative;
        if (ticket === selection && request === stateRequest) {
          renderState(state);
          message('');
        }
      } catch (error) {
        if (ticket === selection && request === stateRequest) message(`Could not load state: ${error.message}`, true);
      }
    }
    async function loadGame(selectedView = '') {
      const ticket = ++selection;
      const gameId = gameSelect.value;
      authoritative = null;
      ++mapRequest;
      viewSelect.replaceChildren(option('', 'All'));
      viewSelect.disabled = !gameId;
      stateRoot.replaceChildren();
      tabsRoot.replaceChildren();
      historyRoot.replaceChildren();
      historyPanel.hidden = true;
      if (!gameId) return;
      message('Loading game…');
      try {
        const [state, revisions] = await Promise.all([
          get(`/games/${encodeURIComponent(gameId)}/authoritative-state`),
          get(`/games/${encodeURIComponent(gameId)}/revisions`)
        ]);
        if (ticket !== selection) return;
        authoritative = state;
        for (const actor of state.entities.filter(entity => entity.kind === 'creature')) {
          viewSelect.append(option(actor.id, `${actor.name} (${actor.id})`));
        }
        if ([...viewSelect.options].some(item => item.value === selectedView)) viewSelect.value = selectedView;
        renderHistory(gameId, revisions, ticket);
        await loadState(ticket);
      } catch (error) {
        if (ticket === selection) message(`Could not load game: ${error.message}`, true);
      }
    }
    async function loadGames() {
      gameSelect.disabled = true;
      viewSelect.disabled = true;
      message('Loading games…');
      try {
        const games = await get('/games');
        gameSelect.replaceChildren(option('', games.length ? 'Select a game' : 'No games available'));
        for (const game of games) gameSelect.append(option(game.id, `${game.title} (${game.id})`));
        gameSelect.disabled = !games.length;
        message(games.length ? '' : 'No games exist yet. Create one through the Realm API.');
      } catch (error) {
        message(`Could not list games: ${error.message}`, true);
      }
    }
    gameSelect.addEventListener('change', () => loadGame());
    viewSelect.addEventListener('change', () => loadState(selection));
    document.querySelector('#refresh').addEventListener('click', async () => {
      const selected = gameSelect.value;
      const selectedView = viewSelect.value;
      await loadGames();
      if (selected && [...gameSelect.options].some(item => item.value === selected)) {
        gameSelect.value = selected;
        await loadGame(selectedView);
      }
    });
    loadGames();
  </script>
</body>
</html>
